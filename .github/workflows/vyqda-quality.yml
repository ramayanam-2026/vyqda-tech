name: VYQDA code and SEO quality

on:
  push:
    branches:
      - design/v2-from-scratch
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vyqda-quality-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Type check, build and SEO audits
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - name: Resolve and install dependencies
        run: npm install
      - name: Apply compatible dependency security fixes
        run: npm audit fix
      - name: Report dependency vulnerabilities
        shell: bash
        run: |
          npm audit --json > "$RUNNER_TEMP/npm-audit.json" || true
          node - "$RUNNER_TEMP/npm-audit.json" <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          console.log('Dependency vulnerability counts:', JSON.stringify(report.metadata?.vulnerabilities ?? {}));
          for (const [name, finding] of Object.entries(report.vulnerabilities ?? {})) {
            console.log(`${name}: severity=${finding.severity}; direct=${finding.isDirect}; range=${finding.range}; fixAvailable=${JSON.stringify(finding.fixAvailable)}`);
            for (const advisory of finding.via ?? []) {
              if (typeof advisory === 'object') console.log(`  advisory: ${advisory.title}; range=${advisory.range}; url=${advisory.url}`);
            }
          }
          NODE
      - name: Type-check Astro pages
        run: npm run check
      - name: Build static pages
        run: npm run build
      - name: Audit technical SEO output
        run: npm run seo:audit
      - name: Audit page content
        run: npm run content:audit
      - name: Commit verified lockfile
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already in sync."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "Refresh dependency lockfile for Astro 7"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
